<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support - Untangled</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    .container {
      max-width: 720px;
      text-align: center;
    }

    .intro {
      font-size: 18px;
      opacity: 0.75;
      margin-bottom: 48px;
    }

    .form-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 48px;
    }

    .form-wrap iframe {
      display: block;
      width: 100%;
      height: 720px;
      border: 0;
    }

    @media (max-width: 680px) {
      .intro { font-size: 17px; margin-bottom: 36px; }
      .form-wrap { margin-bottom: 36px; }
      .form-wrap iframe { height: 640px; }
    }
  </style>
</head>

<body>

  <nav>
    <a class="wordmark" href="/">Un<span>tangled</span></a>
  </nav>

  <div class="container">
    <h1>Support</h1>

    <p class="intro">Having trouble with Untangled? We're here to help.</p>

    <div class="form-wrap">
      <iframe src="https://forms.fillout.com/t/tvJJ6j87Eyus" title="Untangled support form" loading="lazy"></iframe>
    </div>

  </div>

  <footer>© 2026 Untangled · untangledknitting.com</footer>

</body>

</html>
